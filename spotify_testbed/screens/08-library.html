<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><span class="avatar"></span><h1 data-k="library.title"></h1></header>
<main>
  <div class="chips"><span class="chip" data-k="library.chip.playlists"></span><span class="chip" data-k="library.chip.artists"></span><span class="chip" data-k="library.chip.albums"></span><span class="chip" data-k="library.chip.podcasts"></span></div>
  <div class="sortbar"><span data-k="library.sort.recents"></span><span>▦</span></div>
  <div class="row"><span class="art c"></span><span class="txt"><span class="t" data-k="library.liked.title"></span><span class="s" data-k="library.liked.sub"></span></span></div>
  <div class="row"><span class="art"></span><span class="txt"><span class="t" data-k="library.episodes.title"></span><span class="s" data-k="library.episodes.sub"></span></span></div>
  <div class="row"><span class="art b"></span><span class="txt"><span class="t" data-k="library.pl1.title"></span><span class="s" data-k="library.pl1.sub"></span></span></div>
  <div class="row"><span class="art round d"></span><span class="txt"><span class="t" data-k="library.artist1.title"></span><span class="s" data-k="library.artist1.sub"></span></span></div>
  <div class="row"><span class="art"></span><span class="txt"><span class="t" data-k="library.album1.title"></span><span class="s" data-k="library.album1.sub"></span></span></div>
  <div class="row"><span class="art round add">＋</span><span class="txt"><span class="t" data-k="library.add.artists"></span></span></div>
  <div class="row"><span class="art add">＋</span><span class="txt"><span class="t" data-k="library.add.podcasts"></span></span></div>
</main>
<style>
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #f59b23; flex-shrink: 0; }
.sortbar { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.art.add { background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #b3b3b3; }
</style>
<nav class="tabbar">
  <div class="tab"><span class="ico">⌂</span><span data-k="tab.home"></span></div>
  <div class="tab"><span class="ico">⌕</span><span data-k="tab.search"></span></div>
  <div class="tab on"><span class="ico">≡</span><span data-k="tab.library"></span></div>
  <div class="tab"><span class="ico">◉</span><span data-k="tab.premium"></span></div>
</nav>
</body>
</html>
