<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><h1 data-k="home.greeting"></h1></header>
<main>
  <div class="chips"><span class="chip on" data-k="home.chip.all"></span><span class="chip" data-k="home.chip.music"></span><span class="chip" data-k="home.chip.podcasts"></span><span class="chip" data-k="home.chip.audiobooks"></span></div>
  <div class="grid2">
    <div class="tile"><span class="art"></span><span data-k="home.tile.liked"></span></div>
    <div class="tile"><span class="art b"></span><span data-k="home.tile.dailymix1"></span></div>
    <div class="tile"><span class="art c"></span><span data-k="home.tile.discover"></span></div>
    <div class="tile"><span class="art d"></span><span data-k="home.tile.release"></span></div>
    <div class="tile"><span class="art b"></span><span data-k="home.tile.chill"></span></div>
    <div class="tile"><span class="art c"></span><span data-k="home.tile.episodes"></span></div>
  </div>
  <h2 class="h-sec" data-k="home.sec.madeforyou"></h2>
  <div class="cards">
    <div class="card"><div class="art"></div><p class="t" data-k="home.card1.title"></p><p class="s" data-k="home.card1.sub"></p></div>
    <div class="card"><div class="art d"></div><p class="t" data-k="home.card2.title"></p><p class="s" data-k="home.card2.sub"></p></div>
  </div>
  <h2 class="h-sec" data-k="home.sec.recent"></h2>
</main>
<nav class="tabbar">
  <div class="tab on"><span class="ico">⌂</span><span data-k="tab.home"></span></div>
  <div class="tab"><span class="ico">⌕</span><span data-k="tab.search"></span></div>
  <div class="tab"><span class="ico">≡</span><span data-k="tab.library"></span></div>
  <div class="tab"><span class="ico">◉</span><span data-k="tab.premium"></span></div>
</nav>
</body>
</html>
