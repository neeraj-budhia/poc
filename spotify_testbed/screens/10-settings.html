<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><span class="back">‹</span><h1 data-k="settings.title"></h1></header>
<main>
  <h2 class="set-h" data-k="settings.sec.account"></h2>
  <div class="set-row"><div class="txt"><p class="t" data-k="settings.plan"></p><p class="s" data-k="settings.plan.sub"></p></div></div>
  <h2 class="set-h" data-k="settings.sec.playback"></h2>
  <div class="set-row"><div class="txt"><p class="t" data-k="settings.crossfade"></p><p class="s" data-k="settings.crossfade.sub"></p></div><span class="val" data-k="settings.crossfade.val"></span></div>
  <div class="set-row"><div class="txt"><p class="t" data-k="settings.gapless"></p></div><span class="tog on"></span></div>
  <div class="set-row"><div class="txt"><p class="t" data-k="settings.explicit"></p><p class="s" data-k="settings.explicit.sub"></p></div><span class="tog on"></span></div>
  <h2 class="set-h" data-k="settings.sec.data"></h2>
  <div class="set-row"><div class="txt"><p class="t" data-k="settings.datasaver"></p><p class="s" data-k="settings.datasaver.sub"></p></div><span class="tog"></span></div>
  <div class="set-row"><div class="txt"><p class="t" data-k="settings.storage"></p><p class="s" data-k="settings.storage.sub"></p></div></div>
  <div class="set-row"><div class="txt"><p class="t" data-k="settings.language"></p></div><span class="val" data-k="settings.language.val"></span></div>
  <span class="btn-outline logout" data-k="settings.logout"></span>
  <p class="ver" data-k="settings.version"></p>
</main>
<style>
.set-h { font-size: 17px; font-weight: 700; margin: 14px 0 4px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
.set-row .txt { min-width: 0; flex: 1; }
.set-row .t { font-size: 15px; }
.set-row .s { font-size: 12px; color: #a7a7a7; margin-top: 2px; line-height: 1.35; }
.set-row .val { font-size: 13px; color: #a7a7a7; white-space: nowrap; }
.tog { width: 40px; height: 22px; border-radius: 11px; background: #535353; flex-shrink: 0; position: relative; }
.tog::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.tog.on { background: #1ed760; }
.tog.on::after { inset-inline-start: 21px; }
.logout { margin-top: 14px; }
.ver { font-size: 11px; color: #a7a7a7; margin-top: 10px; }
</style>
</body></html>
