<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="np-top"><span class="ico">⌄</span><div class="np-from"><b data-k="lyrics.song"></b><span data-k="lyrics.artist"></span></div><span class="ico">⋯</span></header>
<main>
  <p class="ly done" data-k="lyrics.l1"></p>
  <p class="ly done" data-k="lyrics.l2"></p>
  <p class="ly cur" data-k="lyrics.l3"></p>
  <p class="ly" data-k="lyrics.l4"></p>
  <p class="ly" data-k="lyrics.l5"></p>
  <p class="ly" data-k="lyrics.l6"></p>
  <p class="ly-note" data-k="lyrics.translate"></p>
  <p class="ly-credit" data-k="lyrics.credit"></p>
  <div class="ly-share"><span class="btn-outline" data-k="lyrics.share"></span><span class="btn-outline" data-k="lyrics.report"></span></div>
</main>
<style>
body { background: #3d6b8a; }
.np-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; }
.np-top .ico { font-size: 22px; }
.np-from { text-align: center; display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
.np-from b { font-size: 14px; }
.ly { font-size: 24px; font-weight: 800; line-height: 1.3; color: #0e2433; margin-top: 12px; }
.ly.done { color: #fff; opacity: .7; }
.ly.cur { color: #fff; }
.ly-note { font-size: 13px; font-weight: 700; margin-top: 22px; }
.ly-credit { font-size: 11px; color: #d5e3ec; margin-top: 6px; }
.ly-share { display: flex; gap: 8px; margin-top: 14px; }
</style>
</body></html>
