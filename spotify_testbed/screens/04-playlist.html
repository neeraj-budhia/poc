<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><span class="back">‹</span></header>
<main>
  <div class="cover art c"></div>
  <h1 class="pl-title" data-k="playlist.title"></h1>
  <p class="pl-desc" data-k="playlist.desc"></p>
  <p class="pl-meta"><span class="logo"></span><span data-k="playlist.madefor"></span></p>
  <p class="pl-meta2" data-k="playlist.meta"></p>
  <div class="pl-actions"><span class="btn-outline" data-k="playlist.btn.save"></span><span class="btn-outline" data-k="playlist.btn.download"></span><span class="play">▶</span></div>
  <div class="row"><span class="art b"></span><span class="txt"><span class="t" data-k="playlist.t1.title"></span><span class="s" data-k="playlist.t1.artist"></span></span></div>
  <div class="row"><span class="art d"></span><span class="txt"><span class="t" data-k="playlist.t2.title"></span><span class="s" data-k="playlist.t2.artist"></span></span></div>
  <div class="row"><span class="art"></span><span class="txt"><span class="t" data-k="playlist.t3.title"></span><span class="s" data-k="playlist.t3.artist"></span></span></div>
  <p class="pl-updated" data-k="playlist.updated"></p>
</main>
<style>
.cover { width: 180px; height: 180px; margin: 0 auto; }
.pl-title { font-size: 22px; font-weight: 800; margin-top: 14px; }
.pl-desc { font-size: 12px; color: #a7a7a7; line-height: 1.4; margin-top: 6px; }
.pl-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; margin-top: 8px; }
.pl-meta2 { font-size: 12px; color: #a7a7a7; margin-top: 4px; }
.pl-actions { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }
.pl-actions .play { margin-inline-start: auto; width: 44px; height: 44px; border-radius: 50%; background: #1ed760; color: #000; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.pl-updated { font-size: 11px; color: #a7a7a7; margin-top: 6px; }
</style>
</body></html>
