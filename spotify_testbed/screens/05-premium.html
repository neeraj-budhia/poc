<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><span class="back">‹</span><h1 data-k="premium.title"></h1></header>
<main>
  <section class="hero">
    <div class="logo-row"><span class="logo"></span><span class="brand" data-k="brand.premium"></span></div>
    <h2 data-k="premium.hero.title"></h2>
    <p class="sub" data-k="premium.hero.sub"></p>
    <button class="cta" data-k="premium.cta.trial"></button>
  </section>
  <section class="plan">
    <div class="plan-head"><h3 data-k="premium.plan.individual.name"></h3><span class="price" data-k="premium.plan.individual.price"></span></div>
    <p class="feat" data-k="premium.plan.individual.feat"></p>
  </section>
  <section class="plan duo">
    <div class="plan-head"><h3 data-k="premium.plan.duo.name"></h3><span class="price" data-k="premium.plan.duo.price"></span></div>
    <p class="feat" data-k="premium.plan.duo.feat"></p>
  </section>
  <section class="plan family">
    <div class="plan-head"><h3 data-k="premium.plan.family.name"></h3><span class="price" data-k="premium.plan.family.price"></span></div>
    <p class="feat" data-k="premium.plan.family.feat"></p>
  </section>
  <p class="legal" data-k="premium.legal"></p>
</main>
<nav class="tabbar">
  <div class="tab"><span class="ico">⌂</span><span data-k="tab.home"></span></div>
  <div class="tab"><span class="ico">⌕</span><span data-k="tab.search"></span></div>
  <div class="tab"><span class="ico">≡</span><span data-k="tab.library"></span></div>
  <div class="tab on"><span class="ico">◉</span><span data-k="tab.premium"></span></div>
</nav>
</body>
</html>
