<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><div class="q"><span class="ico">‹</span><span data-k="results.query"></span><span class="x">✕</span></div></header>
<main>
  <div class="chips"><span class="chip on" data-k="results.chip.top"></span><span class="chip" data-k="results.chip.songs"></span><span class="chip" data-k="results.chip.artists"></span><span class="chip" data-k="results.chip.playlists"></span><span class="chip" data-k="results.chip.albums"></span></div>
  <div class="row"><span class="art round"></span><span class="txt"><span class="t" data-k="results.r1.title"></span><span class="s" data-k="results.r1.sub"></span></span></div>
  <div class="row"><span class="art b"></span><span class="txt"><span class="t" data-k="results.r2.title"></span><span class="s" data-k="results.r2.sub"></span></span></div>
  <div class="row"><span class="art c"></span><span class="txt"><span class="t" data-k="results.r3.title"></span><span class="s" data-k="results.r3.sub"></span></span></div>
  <div class="row"><span class="art d"></span><span class="txt"><span class="t" data-k="results.r4.title"></span><span class="s" data-k="results.r4.sub"></span></span></div>
  <div class="row"><span class="art"></span><span class="txt"><span class="t" data-k="results.r5.title"></span><span class="s" data-k="results.r5.sub"></span></span></div>
  <div class="row"><span class="art b"></span><span class="txt"><span class="t" data-k="results.r6.title"></span><span class="s" data-k="results.r6.sub"></span></span></div>
  <p class="seeall" data-k="results.seeall"></p>
</main>
<style>
.q { flex: 1; display: flex; align-items: center; gap: 10px; background: #2a2a2a; border-radius: 6px; height: 40px; padding: 0 12px; font-size: 15px; }
.q .x { margin-inline-start: auto; color: #b3b3b3; }
.seeall { font-size: 13px; font-weight: 700; color: #b3b3b3; margin-top: 10px; }
</style>
<nav class="tabbar">
  <div class="tab"><span class="ico">⌂</span><span data-k="tab.home"></span></div>
  <div class="tab on"><span class="ico">⌕</span><span data-k="tab.search"></span></div>
  <div class="tab"><span class="ico">≡</span><span data-k="tab.library"></span></div>
  <div class="tab"><span class="ico">◉</span><span data-k="tab.premium"></span></div>
</nav>
</body>
</html>
