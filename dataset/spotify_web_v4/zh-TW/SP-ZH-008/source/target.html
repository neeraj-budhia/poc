<!DOCTYPE html><html lang="zh-TW" dir="ltr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><span class="avatar"></span><h1 data-k="library.title">你的音樂庫</h1></header>
<main>
  <div class="chips"><span class="chip" data-k="library.chip.playlists">播放清單</span><span class="chip" data-k="library.chip.artists">藝人</span><span class="chip" data-k="library.chip.albums">專輯</span><span class="chip" data-k="library.chip.podcasts" style="display: inline-block; white-space: nowrap; vertical-align: bottom; overflow: hidden; text-overflow: ellipsis; max-width: 64px;">Podcast 和節目</span></div>
  <div class="sortbar"><span data-k="library.sort.recents">⇅ 最近</span><span>▦</span></div>
  <div class="row"><span class="art c"></span><span class="txt"><span class="t" data-k="library.liked.title">已按讚的歌曲</span><span class="s" data-k="library.liked.sub">📌 播放清單 • {count} 首歌曲</span></span></div>
  <div class="row"><span class="art"></span><span class="txt"><span class="t" data-k="library.episodes.title">你的單集</span><span class="s" data-k="library.episodes.sub">已儲存和已下載的單集</span></span></div>
  <div class="row"><span class="art b"></span><span class="txt"><span class="t" data-k="library.pl1.title">Road Trip 2026</span><span class="s" data-k="library.pl1.sub">播放清單 • Neeraj</span></span></div>
  <div class="row"><span class="art round d"></span><span class="txt"><span class="t" data-k="library.artist1.title">Tame Impala</span><span class="s" data-k="library.artist1.sub" style="position: relative; top: -14px;">藝人</span></span></div>
  <div class="row"><span class="art"></span><span class="txt"><span class="t" data-k="library.album1.title">Currents</span><span class="s" data-k="library.album1.sub">專輯 • Tame Impala</span></span></div>
  <div class="row"><span class="art round add">＋</span><span class="txt"><span class="t" data-k="library.add.artists">新增藝人</span></span></div>
  <div class="row"><span class="art add">＋</span><span class="txt"><span class="t" data-k="library.add.podcasts">新增 Podcast 和節目</span></span></div>
</main>
<style>
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #f59b23; flex-shrink: 0; }
.sortbar { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.art.add { background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #b3b3b3; }
</style>
<nav class="tabbar">
  <div class="tab"><span class="ico">⌂</span><span data-k="tab.home">首頁</span></div>
  <div class="tab"><span class="ico">⌕</span><span data-k="tab.search">搜尋</span></div>
  <div class="tab on"><span class="ico">≡</span><span data-k="tab.library">你的音樂庫</span></div>
  <div class="tab"><span class="ico">◉</span><span data-k="tab.premium">Premium</span></div>
</nav>


</body></html>
