<!DOCTYPE html><html lang="zh-TW" dir="ltr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><h1 data-k="home.greeting">晚上好</h1></header>
<main>
  <div class="chips"><span class="chip on" data-k="home.chip.all">全部</span><span class="chip" data-k="home.chip.music">éŸ³æ¨‚</span><span class="chip" data-k="home.chip.podcasts">Podcast</span><span class="chip" data-k="home.chip.audiobooks">有聲書</span></div>
  <div class="grid2">
    <div class="tile"><span class="art"></span><span data-k="home.tile.liked">已按讚的歌曲</span></div>
    <div class="tile"><span class="art b"></span><span data-k="home.tile.dailymix1">Daily Mix 1</span></div>
    <div class="tile"><span class="art c"></span><span data-k="home.tile.discover">Discover Weekly</span></div>
    <div class="tile"><span class="art d"></span><span data-k="home.tile.release">Release Radar</span></div>
    <div class="tile"><span class="art b"></span><span data-k="home.tile.chill" style="display: inline-block; white-space: nowrap; vertical-align: bottom; overflow: hidden; text-overflow: ellipsis; max-width: 30px;">放鬆氛圍</span></div>
    <div class="tile"><span class="art c"></span><span data-k="home.tile.episodes">你的單集</span></div>
  </div>
  <h2 class="h-sec" data-k="home.sec.madeforyou">為你打造</h2>
  <div class="cards">
    <div class="card"><div class="art"></div><p class="t" data-k="home.card1.title">Daily Mix 2</p><p class="s" data-k="home.card1.sub">Arctic Monkeys、The Strokes、Tame Impala 等</p></div>
    <div class="card"><div class="art d"></div><p class="t" data-k="home.card2.title">你的 2026 年熱門歌曲</p><p class="s" data-k="home.card2.sub">你今年最愛的歌曲，全都收錄在這裡。</p></div>
  </div>
  <h2 class="h-sec" data-k="home.sec.recent">最近播放</h2>
</main>
