<!DOCTYPE html><html lang="zh-TW" dir="ltr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><span class="back">‹</span><h1 data-k="premium.title">Premium</h1></header>
<main>
  <section class="hero">
    <div class="logo-row"><span class="logo"></span><span class="brand" data-k="brand.premium">Premium</span></div>
    <h2 data-k="premium.hero.title" style="display: inline-block; white-space: nowrap; overflow: hidden; height: 13px; line-height: 13px;">以 NT$0 試用 Premium 1 個月</h2>
    <p class="sub" data-k="premium.hero.sub">之後每月只要 NT$149。可隨時取消。</p>
    <button class="cta" data-k="premium.cta.trial">免費試用 1 個月</button>
  </section>
  <section class="plan">
    <div class="plan-head"><h3 data-k="premium.plan.individual.name">個人</h3><span class="price" data-k="premium.plan.individual.price">NT$149 / 月</span></div>
    <p class="feat" data-k="premium.plan.individual.feat">1 個 Premium 帳戶</p>
  </section>
  <section class="plan duo">
    <div class="plan-head"><h3 data-k="premium.plan.duo.name">雙人</h3><span class="price" data-k="premium.plan.duo.price">NT$198 / 月</span></div>
    <p class="feat" data-k="premium.plan.duo.feat">2 個 Premium 帳戶</p>
  </section>
  <section class="plan family">
    <div class="plan-head"><h3 data-k="premium.plan.family.name">家庭</h3><span class="price" data-k="premium.plan.family.price">NT$268 / 月</span></div>
    <p class="feat" data-k="premium.plan.family.feat">premium.plan.family.feat</p>
  </section>
  <p class="legal" data-k="premium.legal">適用相關條款。優惠於 October 31, 2026 結束。僅限個人方案。</p>
</main>
<nav class="tabbar">
  <div class="tab"><span class="ico">⌂</span><span data-k="tab.home">首頁</span></div>
  <div class="tab"><span class="ico">⌕</span><span data-k="tab.search">搜尋</span></div>
  <div class="tab"><span class="ico">≡</span><span data-k="tab.library">你的音樂庫</span></div>
  <div class="tab on"><span class="ico">◉</span><span data-k="tab.premium">Premium</span></div>
</nav>


</body></html>
