<!DOCTYPE html><html lang="ko-KR" dir="ltr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><h1 data-k="home.greeting" style="display: inline-block; white-space: nowrap; overflow: hidden; height: 12px; line-height: 12px;">좋은 저녁이에요</h1></header>
<main>
  <div class="chips"><span class="chip on" data-k="home.chip.all">전체</span><span class="chip" data-k="home.chip.music">음악</span><span class="chip" data-k="home.chip.podcasts">팟캐스트</span><span class="chip" data-k="home.chip.audiobooks">오디오북</span></div>
  <div class="grid2">
    <div class="tile"><span class="art"></span><span data-k="home.tile.liked">좋아요 표시한 곡</span></div>
    <div class="tile"><span class="art b"></span><span data-k="home.tile.dailymix1">Daily Mix 1</span></div>
    <div class="tile"><span class="art c"></span><span data-k="home.tile.discover">home.tile.discover</span></div>
    <div class="tile"><span class="art d"></span><span data-k="home.tile.release">Release Radar</span></div>
    <div class="tile"><span class="art b"></span><span data-k="home.tile.chill">편안한 분위기</span></div>
    <div class="tile"><span class="art c"></span><span data-k="home.tile.episodes">내 에피소드</span></div>
  </div>
  <h2 class="h-sec" data-k="home.sec.madeforyou">회원님을 위한 추천</h2>
  <div class="cards">
    <div class="card"><div class="art"></div><p class="t" data-k="home.card1.title">Daily Mix 2</p><p class="s" data-k="home.card1.sub" style="position: relative; top: -12px;">Arctic Monkeys, The Strokes, Tame Impala 외</p></div>
    <div class="card"><div class="art d"></div><p class="t" data-k="home.card2.title">2026년 내가 가장 많이 들은 곡</p><p class="s" data-k="home.card2.sub">올해 가장 사랑한 곡들을 한데 모았어요.</p></div>
  </div>
  <h2 class="h-sec" data-k="home.sec.recent">최근 재생한 항목</h2>
</main>
<nav class="tabbar">
  <div class="tab on"><span class="ico">⌂</span><span data-k="tab.home">홈</span></div>
  <div class="tab"><span class="ico">⌕</span><span data-k="tab.search">검색</span></div>
  <div class="tab"><span class="ico">≡</span><span data-k="tab.library">내 라이브러리</span></div>
  <div class="tab"><span class="ico">◉</span><span data-k="tab.premium">Premium</span></div>
</nav>


</body></html>
