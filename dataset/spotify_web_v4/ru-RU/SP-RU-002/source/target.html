<!DOCTYPE html><html lang="ru-RU" dir="ltr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><h1 data-k="search.title" style="display: inline-block; white-space: nowrap; overflow: hidden; height: 12px; line-height: 12px;">Поиск</h1></header>
<main>
  <div class="searchbox"><span class="ico">⌕</span><span data-k="search.placeholder">Что хочешь послушать?</span></div>
  <h2 class="h-sec" data-k="search.sec.start">Начать обзор</h2>
  <div class="cats">
    <div class="cat" style="background:#dc148c"><span data-k="search.cat.music">Музыка</span></div>
    <div class="cat" style="background:#006450"><span data-k="search.cat.podcasts">Подкасты</span></div>
    <div class="cat" style="background:#8400e7"><span data-k="search.cat.live">Концерты</span></div>
    <div class="cat" style="background:#1e3264"><span data-k="search.cat.madeforyou">Специально для вас</span></div>
  </div>
  <h2 class="h-sec" data-k="search.sec.browse">Все категории</h2>
  <div class="cats">
    <div class="cat" style="background:#e8115b"><span data-k="search.cat.newreleases">Новинки</span></div>
    <div class="cat" style="background:#8d67ab"><span data-k="search.cat.charts">Чарты</span></div>
    <div class="cat" style="background:#148a08"><span data-k="search.cat.pop">Поп</span></div>
    <div class="cat" style="background:#bc5900"><span data-k="search.cat.hiphop">Хип-хоп</span></div>
    <div class="cat" style="background:#477d95"><span data-k="search.cat.workout" style="display: inline-block; white-space: nowrap; max-width: none; vertical-align: bottom; overflow: hidden; width: 53px;">Тренировка</span></div>
    <div class="cat" style="background:#509bf5"><span data-k="search.cat.sleep">□□□</span></div>
  </div>
</main>
<style>
.searchbox { background: #fff; color: #535353; border-radius: 6px; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 15px; font-weight: 600; }
.searchbox .ico { color: #000; font-size: 20px; }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cat { height: 86px; border-radius: 6px; padding: 10px; font-size: 16px; font-weight: 700; overflow: hidden; }
</style>
<nav class="tabbar">
  <div class="tab"><span class="ico">⌂</span><span data-k="tab.home">Главная</span></div>
  <div class="tab on"><span class="ico">⌕</span><span data-k="tab.search">Поиск</span></div>
  <div class="tab"><span class="ico">≡</span><span data-k="tab.library">Моя медиатека</span></div>
  <div class="tab"><span class="ico">◉</span><span data-k="tab.premium">Premium</span></div>
</nav>


</body></html>
