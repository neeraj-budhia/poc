<!DOCTYPE html><html lang="ur" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><span class="avatar"></span><h1 data-k="library.title" style="line-height: 1.9;">آپ کی لائبریری</h1></header>
<main>
  <div class="chips"><span class="chip" data-k="library.chip.playlists" style="line-height: 1.9;">پلے لسٹس</span><span class="chip" data-k="library.chip.artists" style="line-height: 1.9;">فنکار</span><span class="chip" data-k="library.chip.albums" style="line-height: 1.9;">البمز</span><span class="chip" data-k="library.chip.podcasts" style="line-height: 1.9;">پوڈکاسٹس اور شوز</span></div>
  <div class="sortbar"><span data-k="library.sort.recents" style="line-height: 1.9;">⇅ حالیہ</span><span>▦</span></div>
  <div class="row"><span class="art c"></span><span class="txt"><span class="t" data-k="library.liked.title" style="line-height: 1.9;">پسندیدہ گانے</span><span class="s" data-k="library.liked.sub" style="line-height: 1.9;">📌 پلے لسٹ • {count} گانے</span></span></div>
  <div class="row"><span class="art"></span><span class="txt"><span class="t" data-k="library.episodes.title" style="line-height: 1.9;">آپ کی اقساط</span><span class="s" data-k="library.episodes.sub" style="line-height: 1.9; display: inline-block; white-space: nowrap; max-width: none; vertical-align: bottom; overflow: hidden; width: 66px;">محفوظ اور ڈاؤن لوڈ کردہ اقساط</span></span></div>
  <div class="row"><span class="art b"></span><span class="txt"><span class="t" data-k="library.pl1.title" style="direction: ltr; unicode-bidi: isolate; text-align: right;">Road Trip 2026</span><span class="s" data-k="library.pl1.sub" style="line-height: 1.9;">پلے لسٹ • Neeraj</span></span></div>
  <div class="row"><span class="art round d"></span><span class="txt"><span class="t" data-k="library.artist1.title" style="direction: ltr; unicode-bidi: isolate; text-align: right;">Tame Impala</span><span class="s" data-k="library.artist1.sub" style="line-height: 1.9;">فنکار</span></span></div>
  <div class="row"><span class="art"></span><span class="txt"><span class="t" data-k="library.album1.title" style="direction: ltr; unicode-bidi: isolate; text-align: right;">Currents</span><span class="s" data-k="library.album1.sub" style="line-height: 1.9;">البم • Tame Impala</span></span></div>
  <div class="row"><span class="art round add">＋</span><span class="txt"><span class="t" data-k="library.add.artists" style="display: inline-block; white-space: nowrap; overflow: hidden; height: 9px; line-height: 9px;">فنکار شامل کریں</span></span></div>
  <div class="row"><span class="art add">＋</span><span class="txt"><span class="t" data-k="library.add.podcasts" style="line-height: 1.9;">پوڈکاسٹس اور شوز شامل کریں</span></span></div>
</main>
<style>
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #f59b23; flex-shrink: 0; }
.sortbar { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.art.add { background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #b3b3b3; }
</style>
<nav class="tabbar">
  <div class="tab"><span class="ico">⌂</span><span data-k="tab.home" style="line-height: 1.9;">ہوم</span></div>
  <div class="tab"><span class="ico">⌕</span><span data-k="tab.search" style="line-height: 1.9;">تلاش کریں</span></div>
  <div class="tab on"><span class="ico">≡</span><span data-k="tab.library" style="line-height: 1.9;">آپ کی لائبریری</span></div>
  <div class="tab"><span class="ico">◉</span><span data-k="tab.premium" style="direction: ltr; unicode-bidi: isolate; text-align: right;">Premium</span></div>
</nav>


</body></html>
