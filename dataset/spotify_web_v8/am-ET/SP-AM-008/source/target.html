<!DOCTYPE html><html lang="am-ET" dir="ltr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><span class="avatar"></span><h1 data-k="library.title">ቤተ-መጻሕፍትዎ</h1></header>
<main>
  <div class="chips"><span class="chip" data-k="library.chip.playlists">አጫዋች ዝርዝሮች</span><span class="chip" data-k="library.chip.artists">አርቲስቶች</span><span class="chip" data-k="library.chip.albums">አልበሞች</span><span class="chip" data-k="library.chip.podcasts" style="display: inline-block; white-space: nowrap; max-width: none; vertical-align: bottom; transform: translateX(243px);">ፖድካስቶች እና ትዕይንቶች</span></div>
  <div class="sortbar"><span data-k="library.sort.recents">⇅ የቅርብ ጊዜ</span><span>▦</span></div>
  <div class="row"><span class="art c"></span><span class="txt"><span class="t" data-k="library.liked.title">የተወደዱ ዘፈኖች</span><span class="s" data-k="library.liked.sub">📌 አጫዋች ዝርዝር • {count} ዘፈኖች</span></span></div>
  <div class="row"><span class="art"></span><span class="txt"><span class="t" data-k="library.episodes.title">የእርስዎ ክፍሎች</span><span class="s" data-k="library.episodes.sub">የተቀመጡ እና የወረዱ ክፍሎች</span></span></div>
  <div class="row"><span class="art b"></span><span class="txt"><span class="t" data-k="library.pl1.title">Road Trip 2026</span><span class="s" data-k="library.pl1.sub">አጫዋች ዝርዝር • Neeraj</span></span></div>
  <div class="row"><span class="art round d"></span><span class="txt"><span class="t" data-k="library.artist1.title">Tame Impala</span><span class="s" data-k="library.artist1.sub">አርቲስት</span></span></div>
  <div class="row"><span class="art"></span><span class="txt"><span class="t" data-k="library.album1.title">Currents</span><span class="s" data-k="library.album1.sub">አልበም • Tame Impala</span></span></div>
  <div class="row"><span class="art round add">＋</span><span class="txt"><span class="t" data-k="library.add.artists">አርቲስቶችን አክል</span></span></div>
  <div class="row"><span class="art add">＋</span><span class="txt"><span class="t" data-k="library.add.podcasts">ፖድካስቶችን እና ትዕይንቶችን አክል</span></span></div>
</main>
<style>
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #f59b23; flex-shrink: 0; }
.sortbar { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.art.add { background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #b3b3b3; }
</style>
<nav class="tabbar">
  <div class="tab"><span class="ico">⌂</span><span data-k="tab.home">መነሻ</span></div>
  <div class="tab"><span class="ico">⌕</span><span data-k="tab.search">ፈልግ</span></div>
  <div class="tab on"><span class="ico">≡</span><span data-k="tab.library">ቤተ-መጻሕፍትዎ</span></div>
  <div class="tab"><span class="ico">◉</span><span data-k="tab.premium">Premium</span></div>
</nav>


</body></html>
