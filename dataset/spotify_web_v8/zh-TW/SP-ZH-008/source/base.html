<!DOCTYPE html><html lang="en-US" dir="ltr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><span class="avatar"></span><h1 data-k="library.title">Your Library</h1></header>
<main>
  <div class="chips"><span class="chip" data-k="library.chip.playlists">Playlists</span><span class="chip" data-k="library.chip.artists">Artists</span><span class="chip" data-k="library.chip.albums">Albums</span><span class="chip" data-k="library.chip.podcasts">Podcasts &amp; Shows</span></div>
  <div class="sortbar"><span data-k="library.sort.recents">⇅ Recents</span><span>▦</span></div>
  <div class="row"><span class="art c"></span><span class="txt"><span class="t" data-k="library.liked.title">Liked Songs</span><span class="s" data-k="library.liked.sub">📌 Playlist • 248 songs</span></span></div>
  <div class="row"><span class="art"></span><span class="txt"><span class="t" data-k="library.episodes.title">Your Episodes</span><span class="s" data-k="library.episodes.sub">Saved &amp; downloaded episodes</span></span></div>
  <div class="row"><span class="art b"></span><span class="txt"><span class="t" data-k="library.pl1.title">Road Trip 2026</span><span class="s" data-k="library.pl1.sub">Playlist • Neeraj</span></span></div>
  <div class="row"><span class="art round d"></span><span class="txt"><span class="t" data-k="library.artist1.title">Tame Impala</span><span class="s" data-k="library.artist1.sub">Artist</span></span></div>
  <div class="row"><span class="art"></span><span class="txt"><span class="t" data-k="library.album1.title">Currents</span><span class="s" data-k="library.album1.sub">Album • Tame Impala</span></span></div>
  <div class="row"><span class="art round add">＋</span><span class="txt"><span class="t" data-k="library.add.artists">Add artists</span></span></div>
  <div class="row"><span class="art add">＋</span><span class="txt"><span class="t" data-k="library.add.podcasts">Add podcasts &amp; shows</span></span></div>
</main>
<style>
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #f59b23; flex-shrink: 0; }
.sortbar { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.art.add { background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #b3b3b3; }
</style>
<nav class="tabbar">
  <div class="tab"><span class="ico">⌂</span><span data-k="tab.home">Home</span></div>
  <div class="tab"><span class="ico">⌕</span><span data-k="tab.search">Search</span></div>
  <div class="tab on"><span class="ico">≡</span><span data-k="tab.library">Your Library</span></div>
  <div class="tab"><span class="ico">◉</span><span data-k="tab.premium">Premium</span></div>
</nav>


</body></html>
