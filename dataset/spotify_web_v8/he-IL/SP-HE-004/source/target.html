<!DOCTYPE html><html lang="he-IL" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><span class="back">‹</span></header>
<main>
  <div class="cover art c"></div>
  <h1 class="pl-title" data-k="playlist.title" style="direction: ltr; unicode-bidi: isolate; text-align: right;">Discover Weekly</h1>
  <p class="pl-desc" data-k="playlist.desc">המיקסטייפ השבועי שלך עם מוזיקה טרייה. תיהנו ממוזיקה חדשה ומשירים פחות מוכרים שנבחרו במיוחד בשבילך. מתעדכן בכל יום שני.</p>
  <p class="pl-meta"><span class="logo"></span><span data-k="playlist.madefor" style="display: inline-block; white-space: nowrap; max-width: none; vertical-align: bottom; transform: translateX(-282px);">נוצר עבור Neeraj</span></p>
  <p class="pl-meta2" data-k="playlist.meta">{count} שירים, בערך 2 שעות ו-5 דקות</p>
  <div class="pl-actions"><span class="btn-outline" data-k="playlist.btn.save" style="display: inline-block; white-space: nowrap; max-width: none; vertical-align: bottom; overflow: hidden; width: 31px;">שמירה</span><span class="btn-outline" data-k="playlist.btn.download">הורדה</span><span class="play">▶</span></div>
  <div class="row"><span class="art b"></span><span class="txt"><span class="t" data-k="playlist.t1.title" style="direction: ltr; unicode-bidi: isolate; text-align: right;">Midnight City</span><span class="s" data-k="playlist.t1.artist" style="direction: ltr; unicode-bidi: isolate; text-align: right;">M83</span></span></div>
  <div class="row"><span class="art d"></span><span class="txt"><span class="t" data-k="playlist.t2.title" style="direction: ltr; unicode-bidi: isolate; text-align: right;">Electric Feel</span><span class="s" data-k="playlist.t2.artist" style="direction: ltr; unicode-bidi: isolate; text-align: right;">MGMT</span></span></div>
  <div class="row"><span class="art"></span><span class="txt"><span class="t" data-k="playlist.t3.title" style="direction: ltr; unicode-bidi: isolate; text-align: right;">Breathe Deeper</span><span class="s" data-k="playlist.t3.artist" style="direction: ltr; unicode-bidi: isolate; text-align: right;">Tame Impala</span></span></div>
  <p class="pl-updated" data-k="playlist.updated">עודכן לפני 6 ימים</p>
</main>
<style>
.cover { width: 180px; height: 180px; margin: 0 auto; }
.pl-title { font-size: 22px; font-weight: 800; margin-top: 14px; }
.pl-desc { font-size: 12px; color: #a7a7a7; line-height: 1.4; margin-top: 6px; }
.pl-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; margin-top: 8px; }
.pl-meta2 { font-size: 12px; color: #a7a7a7; margin-top: 4px; }
.pl-actions { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }
.pl-actions .play { flex-shrink: 0; margin-inline-start: auto; width: 44px; height: 44px; border-radius: 50%; background: #1ed760; color: #000; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.pl-updated { font-size: 11px; color: #a7a7a7; margin-top: 6px; }
</style>

</body></html>
