<!DOCTYPE html><html lang="ur" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><h1 data-k="search.title" style="line-height: 1.9;">تلاش</h1></header>
<main>
  <div class="searchbox"><span class="ico">⌕</span><span data-k="search.placeholder" style="line-height: 1.9;">آپ کیا سننا چاہتے ہیں؟</span></div>
  <h2 class="h-sec" data-k="search.sec.start" style="line-height: 1.9;">براؤز کرنا شروع کریں</h2>
  <div class="cats">
    <div class="cat" style="background:#dc148c"><span data-k="search.cat.music" style="line-height: 1.9;">موسیقی</span></div>
    <div class="cat" style="background:#006450"><span data-k="search.cat.podcasts" style="line-height: 1.9;">پوڈکاسٹس</span></div>
    <div class="cat" style="background:#8400e7"><span data-k="search.cat.live" style="line-height: 1.9;">لائیو ایونٹس</span></div>
    <div class="cat" style="background:#1e3264"><span data-k="search.cat.madeforyou" style="line-height: 1.9; display: inline-block; white-space: nowrap; vertical-align: bottom; overflow: hidden; text-overflow: ellipsis; max-width: 70px;">آپ کے لیے تیار کردہ</span></div>
  </div>
  <h2 class="h-sec" data-k="search.sec.browse" style="line-height: 1.9;">سب براؤز کریں</h2>
  <div class="cats">
    <div class="cat" style="background:#e8115b"><span data-k="search.cat.newreleases" style="line-height: 1.9;">نئی ریلیزز</span></div>
    <div class="cat" style="background:#8d67ab"><span data-k="search.cat.charts" style="line-height: 1.9;">چارٹس</span></div>
    <div class="cat" style="background:#148a08"><span data-k="search.cat.pop" style="line-height: 1.9;">پاپ</span></div>
    <div class="cat" style="background:#bc5900"><span data-k="search.cat.hiphop" style="line-height: 1.9;">Hip-Hop</span></div>
    <div class="cat" style="background:#477d95"><span data-k="search.cat.workout" style="line-height: 1.9; display: inline-block; white-space: nowrap; max-width: none; vertical-align: bottom; overflow: hidden; width: 20px;">ورزش</span></div>
    <div class="cat" style="background:#509bf5"><span data-k="search.cat.sleep" style="line-height: 1.9;">نیند</span></div>
  </div>
</main>
<style>
.searchbox { background: #fff; color: #535353; border-radius: 6px; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 15px; font-weight: 600; }
.searchbox .ico { color: #000; font-size: 20px; }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cat { height: 86px; border-radius: 6px; padding: 10px; font-size: 16px; font-weight: 700; overflow: hidden; }
</style>
<nav class="tabbar">
  <div class="tab"><span class="ico">⌂</span><span data-k="tab.home">ہوم</span></div>
  <div class="tab on"><span class="ico">⌕</span><span data-k="tab.search">تلاش</span></div>
  <div class="tab"><span class="ico">≡</span><span data-k="tab.library">آپ کی لائبریری</span></div>
  <div class="tab"><span class="ico">◉</span><span data-k="tab.premium" style="direction: ltr; unicode-bidi: isolate; font-family: system-ui, -apple-system, sans-serif; text-align: right;">Premium</span></div>
</nav>


</body></html>
