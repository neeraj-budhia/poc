<!DOCTYPE html><html lang="ko-KR" dir="ltr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<link rel="stylesheet" href="spotify.css">
</head>
<body>
<header class="appbar"><span class="back">‹</span><h1 data-k="premium.title">Premium</h1></header>
<main>
  <section class="hero">
    <div class="logo-row"><span class="logo"></span><span class="brand" data-k="brand.premium">Premium</span></div>
    <h2 data-k="premium.hero.title">1개월간 ₩0에 Premium 이용하기</h2>
    <p class="sub" data-k="premium.hero.sub">이후 월 $11.99. 언제든지 해지할 수 있습니다.</p>
    <button class="cta" data-k="premium.cta.trial">1개월 무료 체험하기</button>
  </section>
  <section class="plan">
    <div class="plan-head"><h3 data-k="premium.plan.individual.name">개인</h3><span class="price" data-k="premium.plan.individual.price">월 ₩10,900</span></div>
    <p class="feat" data-k="premium.plan.individual.feat">Premium 계정 1개</p>
  </section>
  <section class="plan duo">
    <div class="plan-head"><h3 data-k="premium.plan.duo.name">듀오</h3><span class="price" data-k="premium.plan.duo.price">월 ₩16,350</span></div>
    <p class="feat" data-k="premium.plan.duo.feat">Premium 계정 2개</p>
  </section>
  <section class="plan family">
    <div class="plan-head"><h3 data-k="premium.plan.family.name">패밀리</h3><span class="price" data-k="premium.plan.family.price">월 ₩17,900</span></div>
    <p class="feat" data-k="premium.plan.family.feat" style="display: inline-block; white-space: nowrap; max-width: none; vertical-align: bottom; transform: translateX(247px);">Premium 계정 최대 6개</p>
  </section>
  <p class="legal" data-k="premium.legal">약관이 적용됩니다. 혜택은 2026년 10월 31일에 종료됩니다. 개인 요금제에만 해당됩니다.</p>
</main>
<nav class="tabbar">
  <div class="tab"><span class="ico">⌂</span><span data-k="tab.home">홈</span></div>
  <div class="tab"><span class="ico">⌕</span><span data-k="tab.search">검색</span></div>
  <div class="tab"><span class="ico">≡</span><span data-k="tab.library">내 라이브러리</span></div>
  <div class="tab on"><span class="ico">◉</span><span data-k="tab.premium">Premium</span></div>
</nav>


</body></html>
